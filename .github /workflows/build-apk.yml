name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Dependencies
        run: npm install

      - name: Prepare and Sync Android Platform
        run: |
          # If native android folder with gradlew is missing, initialize it via Capacitor CLI
          if [ ! -f "android/gradlew" ]; then
            rm -rf android
            npx @capacitor/cli add android
          fi

          # Apply custom AndroidManifest.xml (configured permissions, orientation, and app name)
          if [ -f "android-template/AndroidManifest.xml" ]; then
            mkdir -p android/app/src/main
            cp -f android-template/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

          # Apply custom app icon if provided
          if [ -f "android-template/app_icon.png" ]; then
            mkdir -p android/app/src/main/res/drawable
            cp -f android-template/app_icon.png android/app/src/main/res/drawable/app_icon.png
          fi

          npx @capacitor/cli sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
